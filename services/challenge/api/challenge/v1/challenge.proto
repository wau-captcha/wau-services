syntax = "proto3";

package challenge.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "challenge/api/challenge/v1;v1";

// ChallengeService issues challenges and checks their answers.
service ChallengeService {
  // NewChallenge issues a challenge for a site key.
  rpc NewChallenge(NewChallengeRequest) returns (Challenge) {
    option (google.api.http) = {get: "/challenge/new"};
  }

  // CheckAnswer consumes a challenge and reports whether the answer is correct.
  // Internal: gRPC only.
  rpc CheckAnswer(CheckAnswerRequest) returns (CheckAnswerReply);
}

message NewChallengeRequest {
  // Public site key of the calling site.
  string site_key = 1 [(google.api.field_behavior) = REQUIRED];
  // "image_distort" (default), "motion_noise", "slide_puzzle", "animal_jump" or "object_rotate".
  string challenge_type = 2;
}

message Challenge {
  string challenge_id = 1;
  // Challenge type, e.g. "image_distort".
  string challenge_type = 2;
  // Media to solve: a PNG for image_distort, an animated GIF for motion_noise, for slide_puzzle
  // a JPEG background with the hole the piece fits into, for animal_jump the animated GIF of
  // round 1: five animal heads jump and the person clicks the one that jumps highest, and for
  // object_rotate the JPEG strip of round 1: an object in frame_count directions beside an arrow
  // on the ground, which the person turns a frame at a time until it faces the arrow.
  bytes image = 3;
  // Seconds until the challenge expires.
  int32 expires_in = 4;
  // MIME type of image, e.g. "image/gif".
  string mime_type = 5;
  // Size to display image at, in CSS pixels; for object_rotate, one frame of it. The media may
  // hold more pixels for finer dots.
  int32 width = 6;
  int32 height = 7;
  // slide_puzzle only: the piece to drag, a PNG with alpha. It starts at x = 0 and moves
  // horizontally only; the answer is where its left edge ends up. The piece fields are optional,
  // so the other types send none of them.
  optional bytes piece_image = 8;
  // slide_puzzle only: top edge of the piece, in CSS pixels of image.
  optional int32 piece_y = 9;
  // slide_puzzle only: width of the piece, in CSS pixels of image.
  optional int32 piece_width = 10;
  // slide_puzzle only: height of the piece, in CSS pixels of image.
  optional int32 piece_height = 11;
  // Proof of work: find a decimal nonce such that SHA-256(pow_salt ‖ challenge_id ‖ nonce), the
  // salt as its 16 bytes and the other two as UTF-8, starts with pow_difficulty zero bits, and
  // send it with the answer as pow_nonce. The SDKs from 1.3.0 do it while the person solves the
  // challenge. A difficulty of 0 asks for none.
  bytes pow_salt = 12;
  int32 pow_difficulty = 13;
  // The second round, image being the first: for animal_jump the GIF of round 2 (both play
  // once, 2 s each), for object_rotate the strip of round 2. Unset for the other types.
  optional bytes second_image = 14;
  // object_rotate only: image and second_image are each this many frames of width × height side
  // by side; frame k is the object turned k steps clockwise as seen from above.
  optional int32 frame_count = 15;
}

message CheckAnswerRequest {
  string challenge_id = 1 [(google.api.field_behavior) = REQUIRED];
  // The text read from the image. For slide_puzzle, the JSON the SDK writes from the drag:
  // {"x": <final left edge of the piece>, "t": [[ms, x, y], ...]}, each point the time since
  // pointerdown, the piece's left edge and the pointer's vertical offset from where it went
  // down, in CSS pixels of image. For animal_jump, the JSON the SDK writes from the two clicks:
  // {"c": [{"x": .., "y": .., "ms": .., "p": ..}, {...}]}, one per round in order: where the click
  // landed in CSS pixels of image, the milliseconds since that round's playback started (a replay
  // restarts the count) and the replays used in that round. For object_rotate, the JSON the SDK
  // writes from the presses: {"r": [{"f": .., "s": [[ms, d], ...], "done": ..}, {...}]}, one per
  // round in order: the frame shown when Done was pressed, every press of Rotate right (d = 1)
  // or Rotate left (d = -1) with the milliseconds since that round was shown, and when Done was.
  string answer = 2 [(google.api.field_behavior) = REQUIRED];
  // How the person behaved while the challenge was on screen, as the SDK records it. Clients that
  // do not send it have their answers checked as before.
  Behavior behavior = 3;
  // The site key the client answers for: the answer to a challenge of another key is wrong. Empty
  // from SDKs before 1.3.0, which is accepted.
  string site_key = 4;
  // The /challenge/verify request as verify saw it, compared with the /challenge/new one: its
  // origin (scheme://host[:port], from Origin, or else Referer), the client's address and headers.
  string origin = 5;
  string client_ip = 6;
  string user_agent = 7;
  string sec_fetch_site = 8;
  string accept_language = 9;
  // The proof of work found for pow_salt and pow_difficulty; empty from SDKs before 1.3.0.
  string pow_nonce = 10;
}

message CheckAnswerReply {
  bool success = 1;
  // API key the challenge was issued for.
  string api_key_id = 2;
  string challenge_type = 3;
  // Owner of the API key, whose daily quota a correct answer counts against.
  string user_id = 4;
  // What the behaviour check concluded; success is false for a right answer judged "automated".
  BehaviorResult behavior = 5;
  // Host name of the website the challenge was asked for from; empty when it came with no origin.
  string hostname = 6;
  // The key requires behaviour data and the answer came without any: it was refused for that,
  // right or wrong, and verify answers BEHAVIOR_REQUIRED.
  bool behavior_required = 7;
}

// Behavior is what the SDK records from the moment a challenge is shown (its image has loaded) to
// the moment its answer is sent. Times are milliseconds since it was shown; x and y are CSS pixels
// from the top-left corner of the widget. Key values, page content and anything outside that time
// are never recorded.
message Behavior {
  // Layout of this message; the check only reads the version it knows.
  int32 version = 1;
  // How long the challenge was on screen before the answer was sent.
  int32 elapsed_ms = 2;
  // Where the pointer moved and went down, at most one move every 16 ms and 200 samples in all.
  repeated PointerSample pointer = 3;
  // "mouse", "touch", "pen", or empty when no pointer was used.
  string pointer_type = 4;
  // Milliseconds between key presses in the answer box, at most 64; never the keys.
  repeated int32 key_intervals_ms = 5;
  // Trusted input events in the answer box, from typing, dictation or autocorrect.
  int32 input_events = 6;
  int32 paste_events = 7;
  // Events on the widget that a script dispatched (isTrusted false), the one that sent the answer
  // included.
  int32 untrusted_events = 8;
  // navigator.webdriver: the browser says it is under automation.
  bool webdriver = 9;
  // Time the page was hidden while the challenge was on screen.
  int32 hidden_ms = 10;
  // Hints the browser gives about itself. A script can fake them, so they only lower the score:
  // navigator.userAgent names HeadlessChrome,
  bool headless_ua = 11;
  // navigator.languages is empty,
  bool no_languages = 12;
  // or the user agent says Chrome but window.chrome is missing.
  bool chrome_without_window_chrome = 13;
}

message PointerSample {
  // Milliseconds since the challenge was shown.
  int32 t = 1;
  float x = 2;
  float y = 3;
}

// BehaviorResult is what the behaviour check concluded about one answer.
message BehaviorResult {
  // "human"; "suspicious" (the answer still counts, the site decides); "automated" (a right answer
  // was refused); "not_measured" (no behaviour was sent, so only the answer was checked).
  string verdict = 1;
  // From 0 (scripted) to 1 (human-like); unset when not measured.
  optional double score = 2;
  // Short codes of what lowered the score or broke a rule, e.g. "webdriver" or "even_typing".
  repeated string reasons = 3;
}
