syntax = "proto3";
package kratos.api;

option go_package = "challenge/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Challenge challenge = 3;
  Quota quota = 4;
  RateLimit rate_limit = 5;
  Scraping scraping = 6;
  IPHistory ip_history = 7;
  AutoCheck auto_check = 8;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  // CIDR blocks whose X-Forwarded-For header is believed, comma separated: where the load
  // balancer connects from (the ALB's VPC on EKS; loopback behind the local Caddy on Docker
  // Desktop). Requests from anywhere else are known by their own address.
  string trusted_proxies = 3;
}

message Data {
  message Database {
    // PostgreSQL DSN. Keep credentials out of version control.
    string source = 1;
  }
  message Redis {
    // Comma-separated Redis Cluster seed nodes (host:port).
    string addrs = 1;
    string password = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    // Speak TLS to every node, as ElastiCache with in-transit encryption requires. Off by default.
    bool tls = 5;
  }
  Database database = 1;
  Redis redis = 2;
}

message Challenge {
  // Lifetime of an unsolved challenge.
  google.protobuf.Duration ttl = 1;
  // Leading zero bits the proof of work of a challenge must reach: each bit doubles the work, 15
  // is about 33 000 hashes. 0 asks for no proof of work.
  int32 pow_difficulty = 2;
}

message Quota {
  // IANA zone whose calendar days the daily counters follow; the same in every service.
  string time_zone = 1;
}

// RateLimit caps calls per minute, counted in Redis in fixed one-minute windows, before any
// costly work. 0 turns a limit off. Each value can be replaced from the environment, e.g.
// KRATOS_RATE_LIMIT_NEW_PER_IP for new_per_ip (see envconf.Override).
message RateLimit {
  // /challenge/new calls per client address.
  int32 new_per_ip = 1;
  // /challenge/new calls per API key, whatever address they come from.
  int32 new_per_site_key = 2;
  // new_per_site_key for a key the scraping check flagged today.
  int32 new_per_flagged_site_key = 3;
}

// Scraping grades the daily counters of a key (challenges issued, answers checked, right answers,
// answers judged automated). A key is flagged, and throttled to new_per_flagged_site_key for the
// rest of the day, when it was issued flag_min_issued challenges of which under
// flag_max_answered_percent were answered, or answered flag_min_answered of which under
// flag_max_solved_percent were right or over flag_max_automated_percent automated. It is
// suspended only once issued suspend_min_issued with under suspend_max_answered_percent answered.
// Each value can be replaced from the environment, e.g. KRATOS_SCRAPING_FLAG_MIN_ISSUED.
message Scraping {
  int32 flag_min_issued = 1;
  int32 flag_max_answered_percent = 2;
  int32 flag_min_answered = 3;
  int32 flag_max_solved_percent = 4;
  int32 flag_max_automated_percent = 5;
  int32 suspend_min_issued = 6;
  int32 suspend_max_answered_percent = 7;
}

// IPHistory counts, per client address, wrong answers in fixed 10-minute buckets and answers
// judged automated over the last hour. Over wrong_per_10_minutes, the address gets RATE_LIMITED
// on /challenge/new and /challenge/verify for the rest of the bucket; over automated_per_hour,
// its later verdicts carry ip_bad_history. Each value can be replaced from the environment, e.g.
// KRATOS_IP_HISTORY_WRONG_PER_10_MINUTES.
message IPHistory {
  int32 wrong_per_10_minutes = 1;
  int32 automated_per_hour = 2;
}

// AutoCheck tunes auto_check, which lets a visitor through without a puzzle when the browser and
// behaviour signals are clean (see biz/autocheck.go). Each value but clearance_secret can be
// replaced from the environment, e.g. KRATOS_AUTO_CHECK_POW_DIFFICULTY.
message AutoCheck {
  // Leading zero bits of its proof of work, the cost of every pass to the client; the other types
  // use challenge.pow_difficulty. 0 asks for none.
  int32 pow_difficulty = 1;
  // The least score, in percent, that passes.
  int32 min_score_percent = 2;
  // Passes one client address may get per hour; past them its visitors get the fallback. 0 turns
  // the cap off.
  int32 passes_per_ip_hour = 3;
  // "strict": an automatic pass needs a clearance, which the browser earns by solving a puzzle of
  // the key; "balanced": a first visit without one may pass on its signals alone.
  string mode = 4;
  // Balanced mode: passes without a clearance one client address may get per hour. 0 turns the cap
  // off.
  int32 first_visit_passes_per_ip_hour = 5;
  // How long a clearance lasts, from 1 hour to 30 days.
  google.protobuf.Duration clearance_ttl = 6;
  // Automatic passes one clearance may give per hour and per local day. 0 turns that cap off.
  int32 clearance_passes_per_hour = 7;
  int32 clearance_passes_per_day = 8;
  // An answer from the range of a cloud or hosting provider (biz/hostingranges.txt) never passes
  // automatically, whatever its clearance and score.
  bool block_hosting_addresses = 9;
  // Comma-separated CIDR blocks to treat as hosting ranges too.
  string extra_hosting_cidrs = 10;
  // The pointer evidence of an answer lowers its score only when true; it is logged either way.
  bool enforce_pointer_signals = 11;
  // Signs clearances, through a key derived from it: the token secret verify signs tokens with.
  string clearance_secret = 12;
}
