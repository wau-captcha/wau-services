syntax = "proto3";
package kratos.api;

option go_package = "challenge/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Challenge challenge = 3;
  Quota quota = 4;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  // CIDR blocks whose X-Forwarded-For header is believed, comma separated; the gateway
  // sits in one of them. Requests from anywhere else are known by their own address.
  string trusted_proxies = 3;
}

message Data {
  message Database {
    // PostgreSQL DSN. Keep credentials out of version control.
    string source = 1;
  }
  message Redis {
    // Comma-separated Redis Cluster seed nodes (host:port).
    string addrs = 1;
    string password = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

message Challenge {
  // Lifetime of an unsolved challenge.
  google.protobuf.Duration ttl = 1;
}

message Quota {
  // IANA zone whose calendar days the daily counters follow; the same in every service.
  string time_zone = 1;
}
