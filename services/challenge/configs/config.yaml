server:
  http:
    addr: 0.0.0.0:8000
    # motion_noise encodes a multi-megabyte GIF (~0.3s on a dev machine); leave headroom under load.
    timeout: 3s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    source: ${DATABASE_SOURCE:postgres://postgres:postgres@127.0.0.1:5432/wau?sslmode=disable}
  redis:
    addrs:
      - 127.0.0.1:7001
      - 127.0.0.1:7002
      - 127.0.0.1:7003
      - 127.0.0.1:7004
      - 127.0.0.1:7005
      - 127.0.0.1:7006
    password: ${REDIS_PASSWORD:}
    read_timeout: 0.2s
    write_timeout: 0.2s
challenge:
  ttl: 120s
