server:
  http:
    addr: ${KRATOS_HTTP_ADDR}
    timeout: 3s
  grpc:
    addr: ${KRATOS_GRPC_ADDR}
    timeout: 1s
  trusted_proxies: ${KRATOS_TRUSTED_PROXIES}
data:
  database:
    source: ${KRATOS_DATABASE_SOURCE}
  redis:
    addrs: ${KRATOS_REDIS_ADDRS}
    password: ${KRATOS_REDIS_PASSWORD}
    read_timeout: 0.2s
    write_timeout: 0.2s
    tls: ${KRATOS_REDIS_TLS}
challenge:
  ttl: 120s
  pow_difficulty: 15
quota:
  time_zone: Asia/Ho_Chi_Minh
# Per minute; KRATOS_RATE_LIMIT_<KEY> replaces a value, e.g. KRATOS_RATE_LIMIT_NEW_PER_IP.
rate_limit:
  new_per_ip: 30
  new_per_site_key: 600
  new_per_flagged_site_key: 60
# The graded response to scraping (see conf.proto); KRATOS_SCRAPING_<KEY> replaces a value.
scraping:
  flag_min_issued: 500
  flag_max_answered_percent: 10
  flag_min_answered: 200
  flag_max_solved_percent: 10
  flag_max_automated_percent: 50
  suspend_min_issued: 5000
  suspend_max_answered_percent: 5
# Per client address; KRATOS_IP_HISTORY_<KEY> replaces a value.
ip_history:
  wrong_per_10_minutes: 20
  automated_per_hour: 5
# auto_check; KRATOS_AUTO_CHECK_<KEY> replaces a value, but not clearance_secret.
auto_check:
  pow_difficulty: 18                # bits; the other types use challenge.pow_difficulty
  min_score_percent: 80             # least score for a pass
  passes_per_ip_hour: 30            # auto passes one address may get per hour; then it gets the fallback
  mode: balanced                    # strict: an automatic pass needs a clearance; balanced: a first visit may pass on signals alone
  first_visit_passes_per_ip_hour: 5 # balanced mode: passes without a clearance per address and hour
  clearance_ttl: 604800s            # 168h: how long a clearance from a solved puzzle lasts (protobuf durations are in seconds)
  clearance_passes_per_hour: 6      # automatic passes one clearance may give per hour
  clearance_passes_per_day: 24      # and per day
  block_hosting_addresses: true     # an answer from a cloud or hosting range never passes automatically
  extra_hosting_cidrs: ""           # comma-separated ranges to treat as hosting too
  enforce_pointer_signals: false    # pointer evidence only lowers the score when true; it is always logged
  clearance_secret: ${KRATOS_TOKEN_SECRET} # verify's token secret; clearances use a key derived from it
