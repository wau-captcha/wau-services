openapi: 3.0.3
info:
    title: ChallengeService API
    description: ChallengeService issues challenges and checks their answers.
    version: 0.0.1
paths:
    /challenge/new:
        get:
            tags:
                - ChallengeService
            description: NewChallenge issues a challenge for a site key.
            operationId: ChallengeService_NewChallenge
            parameters:
                - name: site_key
                  in: query
                  description: Public site key of the calling site.
                  schema:
                    type: string
                - name: challenge_type
                  in: query
                  description: |-
                    "image_distort" (default), "motion_noise", "slide_puzzle", "animal_jump", "object_rotate" or
                     "auto_check".
                  schema:
                    type: string
                - name: fallback_type
                  in: query
                  description: |-
                    auto_check only: the interactive type the site prefers if the visitor is not let through; the
                     server may pick another the key allows.
                  schema:
                    type: string
