server:
  http:
    addr: ${KRATOS_HTTP_ADDR}
    timeout: 5s
routes:
  - prefix: /v1/
    upstream: ${KRATOS_TENANT_UPSTREAM}
  - prefix: /challenge/new
    upstream: ${KRATOS_CHALLENGE_UPSTREAM}
  - prefix: /challenge/verify
    upstream: ${KRATOS_VERIFY_UPSTREAM}
  - prefix: /siteverify
    upstream: ${KRATOS_VERIFY_UPSTREAM}
rate_limit:
  prefixes:
    - /v1/auth/
  requests: 20
  window: 60s
  trusted_proxies: ${KRATOS_TRUSTED_PROXIES}
