server:
  http:
    addr: ${KRATOS_HTTP_ADDR}
    timeout: 1s
  grpc:
    addr: ${KRATOS_GRPC_ADDR}
    timeout: 1s
  trusted_proxies: ${KRATOS_TRUSTED_PROXIES}
data:
  database:
    source: ${KRATOS_DATABASE_SOURCE}
  redis:
    addrs: ${KRATOS_REDIS_ADDRS}
    password: ${KRATOS_REDIS_PASSWORD}
    read_timeout: 0.2s
    write_timeout: 0.2s
    tls: ${KRATOS_REDIS_TLS}
client:
  challenge:
    endpoint: ${KRATOS_CHALLENGE_GRPC_ENDPOINT}
    timeout: 0.5s
token:
  secret: ${KRATOS_TOKEN_SECRET}
  ttl: 120s
quota:
  time_zone: Asia/Ho_Chi_Minh
# Per minute; KRATOS_RATE_LIMIT_<KEY> replaces a value, e.g. KRATOS_RATE_LIMIT_VERIFY_PER_IP.
rate_limit:
  verify_per_ip: 60
  siteverify_per_secret_key: 1200
