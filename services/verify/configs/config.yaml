server:
  http:
    addr: 0.0.0.0:8001
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9001
    timeout: 1s
data:
  database:
    source: ${DATABASE_SOURCE:postgres://postgres:postgres@127.0.0.1:5432/wau?sslmode=disable}
  redis:
    addrs:
      - 127.0.0.1:7001
      - 127.0.0.1:7002
      - 127.0.0.1:7003
      - 127.0.0.1:7004
      - 127.0.0.1:7005
      - 127.0.0.1:7006
    password: ${REDIS_PASSWORD:}
    read_timeout: 0.2s
    write_timeout: 0.2s
client:
  challenge:
    endpoint: 127.0.0.1:9000
    timeout: 0.5s
token:
  secret: ${TOKEN_SECRET:}
  ttl: 120s
