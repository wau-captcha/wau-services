syntax = "proto3";

package verify.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "verify/api/verify/v1;v1";

// VerifyService turns solved challenges into one-time tokens and validates them for site backends.
service VerifyService {
  // VerifyChallenge checks an answer and issues a one-time token on success.
  rpc VerifyChallenge(VerifyChallengeRequest) returns (VerifyChallengeReply) {
    option (google.api.http) = {
      post: "/challenge/verify"
      body: "*"
    };
  }

  // SiteVerify consumes the token sent in the body, as JSON {"token": "..."} or as the form
  // token=..., so it never lands in access logs. Requires "Authorization: Bearer <secret_key>".
  // Deprecated, for SDKs before 1.3.0: the token as ?token= with an empty body; a token in the
  // body wins over one in the query.
  rpc SiteVerify(SiteVerifyRequest) returns (SiteVerifyReply) {
    option (google.api.http) = {
      post: "/siteverify"
      body: "*"
    };
  }
}

message VerifyChallengeRequest {
  string challenge_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Text read from the challenge image. For slide_puzzle, the JSON the SDK writes from the drag:
  // {"x": <final left edge of the piece>, "t": [[ms, x, y], ...]}; for animal_jump, the JSON it
  // writes from the two clicks: {"c": [{"x": .., "y": .., "ms": .., "p": ..}, {...}]}; see the
  // challenge's CheckAnswerRequest.answer.
  string answer = 2 [(google.api.field_behavior) = REQUIRED];
  // How the person behaved while the challenge was on screen, as the SDK records it. Optional:
  // without it only the answer is checked, as before, unless the key requires it.
  Behavior behavior = 3;
  // The site key of the widget: an answer to a challenge of another key is wrong. Optional, for
  // SDKs before 1.3.0.
  string site_key = 4;
  // The proof of work for the pow_salt and pow_difficulty of the challenge (see /challenge/new).
  // Optional, for SDKs before 1.3.0: without it the verdict is at most "suspicious".
  string pow_nonce = 5;
}

message VerifyChallengeReply {
  bool success = 1;
  // One-time token, set only on success.
  string token = 2;
  // Seconds until the token expires.
  int32 expires_in = 3;
}

message SiteVerifyRequest {
  string token = 1 [(google.api.field_behavior) = REQUIRED];
}

message SiteVerifyReply {
  bool success = 1;
  string challenge_type = 2;
  // Time the challenge was solved.
  google.protobuf.Timestamp challenge_ts = 3;
  // What the behaviour check concluded about the answer behind the token, set when success is
  // true. Answers judged "automated" never get a token.
  BehaviorResult behavior = 4;
  // Host name of the website the challenge was solved on, from the Origin of the browser's
  // requests: compare it with your own. A script outside a browser can forge it. Empty when the
  // challenge was asked for without an origin.
  string hostname = 5;
}

// Behavior is what the SDK records from the moment a challenge is shown (its image has loaded) to
// the moment its answer is sent. Times are milliseconds since it was shown; x and y are CSS pixels
// from the top-left corner of the widget. Key values, page content and anything outside that time
// are never recorded. The same fields as challenge.v1.Behavior, which verify passes it on as.
message Behavior {
  // Layout of this message; the check only reads the version it knows.
  int32 version = 1;
  // How long the challenge was on screen before the answer was sent.
  int32 elapsed_ms = 2;
  // Where the pointer moved and went down, at most one move every 16 ms and 200 samples in all.
  repeated PointerSample pointer = 3;
  // "mouse", "touch", "pen", or empty when no pointer was used.
  string pointer_type = 4;
  // Milliseconds between key presses in the answer box, at most 64; never the keys.
  repeated int32 key_intervals_ms = 5;
  // Trusted input events in the answer box, from typing, dictation or autocorrect.
  int32 input_events = 6;
  int32 paste_events = 7;
  // Events on the widget that a script dispatched (isTrusted false), the one that sent the answer
  // included.
  int32 untrusted_events = 8;
  // navigator.webdriver: the browser says it is under automation.
  bool webdriver = 9;
  // Time the page was hidden while the challenge was on screen.
  int32 hidden_ms = 10;
  // Hints the browser gives about itself. A script can fake them, so they only lower the score:
  // navigator.userAgent names HeadlessChrome,
  bool headless_ua = 11;
  // navigator.languages is empty,
  bool no_languages = 12;
  // or the user agent says Chrome but window.chrome is missing.
  bool chrome_without_window_chrome = 13;
}

message PointerSample {
  // Milliseconds since the challenge was shown.
  int32 t = 1;
  float x = 2;
  float y = 3;
}

// BehaviorResult is what the behaviour check concluded about the answer behind a token.
message BehaviorResult {
  // "human"; "suspicious" (the answer counted, decide for yourself, e.g. refuse it for sign-ups and
  // logins); "not_measured" (the client sent no behaviour, an SDK before 1.2.0 or a hand-written
  // integration: treat it as untrusted).
  string verdict = 1;
  // From 0 (scripted) to 1 (human-like); unset when not measured.
  optional double score = 2;
  // Short codes of what lowered the score, e.g. "webdriver" or "even_typing".
  repeated string reasons = 3;
}
