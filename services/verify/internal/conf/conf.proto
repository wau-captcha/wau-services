syntax = "proto3";
package kratos.api;

option go_package = "verify/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Client client = 3;
  Token token = 4;
  Quota quota = 5;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    // PostgreSQL DSN. Keep credentials out of version control.
    string source = 1;
  }
  message Redis {
    // Comma-separated Redis Cluster seed nodes (host:port).
    string addrs = 1;
    string password = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

message Client {
  message GRPC {
    string endpoint = 1;
    google.protobuf.Duration timeout = 2;
  }
  GRPC challenge = 1;
}

message Token {
  // HMAC-SHA256 signing key. Keep it out of version control.
  string secret = 1;
  // Lifetime of an issued token.
  google.protobuf.Duration ttl = 2;
}

message Quota {
  // IANA zone whose calendar days the daily counters follow; the same in every service.
  string time_zone = 1;
}
