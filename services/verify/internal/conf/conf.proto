syntax = "proto3";
package kratos.api;

option go_package = "verify/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Client client = 3;
  Token token = 4;
  Quota quota = 5;
  RateLimit rate_limit = 6;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  // CIDR blocks whose X-Forwarded-For header is believed, comma separated: where the load
  // balancer connects from (Traefik's pods on k3s; loopback behind the local Caddy on Docker
  // Desktop). Requests from anywhere else are known by their own address. The same as challenge's.
  string trusted_proxies = 3;
}

message Data {
  message Database {
    // PostgreSQL DSN. Keep credentials out of version control.
    string source = 1;
  }
  message Redis {
    // Comma-separated Redis Cluster seed nodes (host:port).
    string addrs = 1;
    string password = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    // Speak TLS to every node, as ElastiCache with in-transit encryption requires. Off by default.
    bool tls = 5;
  }
  Database database = 1;
  Redis redis = 2;
}

message Client {
  message GRPC {
    string endpoint = 1;
    google.protobuf.Duration timeout = 2;
  }
  GRPC challenge = 1;
}

message Token {
  // HMAC-SHA256 signing key. Keep it out of version control.
  string secret = 1;
  // Lifetime of an issued token.
  google.protobuf.Duration ttl = 2;
}

message Quota {
  // IANA zone whose calendar days the daily counters follow; the same in every service.
  string time_zone = 1;
}

// RateLimit caps calls per minute, counted in Redis in fixed one-minute windows, before any
// costly work. 0 turns a limit off. Each value can be replaced from the environment, e.g.
// KRATOS_RATE_LIMIT_VERIFY_PER_IP for verify_per_ip (see envconf.Override).
message RateLimit {
  // /challenge/verify calls per client address.
  int32 verify_per_ip = 1;
  // /siteverify calls per secret key, known in Redis only by its SHA-256.
  int32 siteverify_per_secret_key = 2;
}
