# Generated with protoc-gen-openapi
# https://github.com/google/gnostic/tree/master/cmd/protoc-gen-openapi

openapi: 3.0.3
info:
    title: VerifyService API
    description: VerifyService turns solved challenges into one-time tokens and validates them for site backends.
    version: 0.0.1
paths:
    /challenge/verify:
        post:
            tags:
                - VerifyService
            description: VerifyChallenge checks an answer and issues a one-time token on success.
            operationId: VerifyService_VerifyChallenge
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/verify.v1.VerifyChallengeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/verify.v1.VerifyChallengeReply'
    /siteverify:
        post:
            tags:
                - VerifyService
            description: |-
                SiteVerify consumes the token sent in the body, as JSON {"token": "..."} or as the form
                 token=..., so it never lands in access logs. Requires "Authorization: Bearer <secret_key>".
                 Deprecated, for SDKs before 1.3.0: the token as ?token= with an empty body; a token in the
                 body wins over one in the query.
            operationId: VerifyService_SiteVerify
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/verify.v1.SiteVerifyRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/verify.v1.SiteVerifyReply'
components:
    schemas:
        verify.v1.Behavior:
            type: object
            properties:
                version:
                    type: integer
                    description: Layout of this message; the check only reads the version it knows.
                    format: int32
                elapsed_ms:
                    type: integer
                    description: How long the challenge was on screen before the answer was sent.
                    format: int32
                pointer:
                    type: array
                    items:
                        $ref: '#/components/schemas/verify.v1.PointerSample'
                    description: Where the pointer moved and went down, at most one move every 16 ms and 200 samples in all.
                pointer_type:
                    type: string
                    description: '"mouse", "touch", "pen", or empty when no pointer was used.'
                key_intervals_ms:
                    type: array
                    items:
                        type: integer
                        format: int32
                    description: Milliseconds between key presses in the answer box, at most 64; never the keys.
                input_events:
                    type: integer
                    description: Trusted input events in the answer box, from typing, dictation or autocorrect.
                    format: int32
                paste_events:
                    type: integer
                    format: int32
                untrusted_events:
                    type: integer
                    description: |-
                        Events on the widget that a script dispatched (isTrusted false), the one that sent the answer
                         included.
                    format: int32
                webdriver:
                    type: boolean
                    description: 'navigator.webdriver: the browser says it is under automation.'
                hidden_ms:
                    type: integer
                    description: Time the page was hidden while the challenge was on screen.
                    format: int32
                headless_ua:
                    type: boolean
                    description: |-
                        Hints the browser gives about itself. A script can fake them, so they only lower the score:
                         navigator.userAgent names HeadlessChrome,
                no_languages:
                    type: boolean
                    description: navigator.languages is empty,
                chrome_without_window_chrome:
                    type: boolean
                    description: or the user agent says Chrome but window.chrome is missing.
            description: |-
                Behavior is what the SDK records from the moment a challenge is shown (its image has loaded, or for
                 auto_check its box appeared) to the moment its answer is sent. Times are milliseconds since it was
                 shown; x and y are CSS pixels from the top-left corner of the widget, also for the presses on the
                 rest of the page that auto_check records. Key values, page content and anything outside that time
                 are never recorded. The same fields as challenge.v1.Behavior, which verify passes it on as.
        verify.v1.BehaviorResult:
            type: object
            properties:
                verdict:
                    type: string
                    description: |-
                        "human"; "suspicious" (the answer counted, decide for yourself, e.g. refuse it for sign-ups and
                         logins); "not_measured" (the client sent no behaviour, an SDK before 1.2.0 or a hand-written
                         integration: treat it as untrusted).
                score:
                    type: number
                    description: From 0 (scripted) to 1 (human-like); unset when not measured.
                    format: double
                reasons:
                    type: array
                    items:
                        type: string
                    description: |-
                        Short codes of what lowered the score, e.g. "webdriver" or "even_typing". An auto_check pass
                         also says how it was earned: "cleared", by a browser that solved a puzzle of this site before,
                         or "first_visit", by one that did not, on its signals alone; refuse "first_visit" for sign-ups,
                         logins and payments to ask such visitors for a puzzle there.
            description: BehaviorResult is what the behaviour check concluded about the answer behind a token.
        verify.v1.PointerSample:
            type: object
            properties:
                t:
                    type: integer
                    description: Milliseconds since the challenge was shown.
                    format: int32
                x:
                    type: number
                    format: float
                y:
                    type: number
                    format: float
        verify.v1.SiteVerifyReply:
            type: object
            properties:
                success:
                    type: boolean
                challenge_type:
                    type: string
                    description: |-
                        The type of the challenge solved. "auto_check" means the visitor passed without solving a
                         puzzle; a site that wants more can require behavior.score above its own threshold for sensitive
                         actions, or refuse the reason "first_visit". A visitor auto_check did not let through solved its
                         fallback, whose type this is then.
                challenge_ts:
                    type: string
                    description: Time the challenge was solved.
                    format: date-time
                behavior:
                    allOf:
                        - $ref: '#/components/schemas/verify.v1.BehaviorResult'
                    description: |-
                        What the behaviour check concluded about the answer behind the token, set when success is
                         true. Answers judged "automated" never get a token.
                hostname:
                    type: string
                    description: |-
                        Host name of the website the challenge was solved on, from the Origin of the browser's
                         requests: compare it with your own. A script outside a browser can forge it. Empty when the
                         challenge was asked for without an origin.
        verify.v1.SiteVerifyRequest:
            required:
                - token
            type: object
            properties:
                token:
                    type: string
        verify.v1.VerifyChallengeReply:
            type: object
            properties:
                success:
                    type: boolean
                token:
                    type: string
                    description: One-time token, set only on success.
                expires_in:
                    type: integer
                    description: Seconds until the token expires.
                    format: int32
                clearance:
                    type: string
                    description: |-
                        Set only on success, after a puzzle (not auto_check): a clearance the browser keeps and sends
                         back with its auto_check answers on this site, to pass without a puzzle for a while. The SDK
                         handles it; a site's backend never needs it.
        verify.v1.VerifyChallengeRequest:
            required:
                - challenge_id
                - answer
            type: object
            properties:
                challenge_id:
                    type: string
                answer:
                    type: string
                    description: |-
                        Text read from the challenge image. For slide_puzzle, the JSON the SDK writes from the drag:
                         {"x": <final left edge of the piece>, "t": [[ms, x, y], ...]}; for animal_jump, the JSON it
                         writes from the two clicks: {"c": [{"x": .., "y": .., "ms": .., "p": ..}, {...}]}; for
                         object_rotate, the JSON it writes from the presses: {"r": [{"f": .., "s": [[ms, d], ...],
                         "done": ..}, {...}]}; for auto_check, the JSON it writes from its browser probes: {"v": 1,
                         "ua": .., "lang": .., "f": [..], "c": .., "m": {..}}, "c" and "m" being optional; see the
                         challenge's CheckAnswerRequest.answer.
                behavior:
                    allOf:
                        - $ref: '#/components/schemas/verify.v1.Behavior'
                    description: |-
                        How the person behaved while the challenge was on screen, as the SDK records it. Optional:
                         without it only the answer is checked, as before, unless the key requires it.
                site_key:
                    type: string
                    description: |-
                        The site key of the widget: an answer to a challenge of another key is wrong. Optional, for
                         SDKs before 1.3.0.
                pow_nonce:
                    type: string
                    description: |-
                        The proof of work for the pow_salt and pow_difficulty of the challenge (see /challenge/new).
                         Optional, for SDKs before 1.3.0: without it the verdict is at most "suspicious".
tags:
    - name: VerifyService
