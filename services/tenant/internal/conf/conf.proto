syntax = "proto3";
package kratos.api;

option go_package = "tenant/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  ApiKey api_key = 4;
  Usage usage = 5;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
}

message Data {
  message Database {
    // PostgreSQL DSN. Keep credentials out of version control.
    string source = 1;
  }
  Database database = 1;
}

message Auth {
  // HMAC-SHA256 signing key for access tokens, at least 32 bytes.
  string secret = 1;
  // Lifetime of an issued access token.
  google.protobuf.Duration ttl = 2;
}

message ApiKey {
  // How many keys a user may hold at once.
  int32 max_per_user = 1;
}

message Usage {
  // IANA name used to group usage records by local day.
  string time_zone = 1;
}
