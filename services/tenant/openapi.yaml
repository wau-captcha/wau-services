components:
    schemas:
        tenant.v1.Admin:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
                email:
                    type: string
                create_date:
                    type: string
                    format: date-time
            description: |-
                Admin is an administrator: a row of the admins table, added with SQL. It is not a
                 dashboard user, even when a user has the same email.
        tenant.v1.AdminApiKey:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                site_key:
                    type: string
                is_active:
                    type: boolean
                is_suspended:
                    type: boolean
                suspend_reason:
                    type: string
                    description: '"ADMIN" or "SCRAPING" while suspended, empty otherwise.'
                create_date:
                    type: string
                    format: date-time
                challenges_today:
                    type: string
                    description: 'Today''s scraping counters: challenges issued and answers checked.'
                verifications_today:
                    type: string
                scraping_flagged:
                    type: boolean
                    description: The scraping check flagged the key today and throttles it.
                solved_today:
                    type: string
                    description: Right answers today, and answers judged automated.
                automated_today:
                    type: string
            description: 'AdminApiKey is an API key as administrators see it: never with its secret key.'
        tenant.v1.AdminApiKeySet:
            type: object
            properties:
                api_keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.AdminApiKey'
        tenant.v1.AdminAppeal:
            type: object
            properties:
                id:
                    type: string
                status:
                    type: string
                    description: '"pending", "approved" or "rejected".'
                message:
                    type: string
                admin_note:
                    type: string
                create_date:
                    type: string
                    format: date-time
                decided_at:
                    type: string
                    format: date-time
                api_key:
                    $ref: '#/components/schemas/tenant.v1.AdminApiKey'
                user_id:
                    type: string
                user_email:
                    type: string
                user_name:
                    type: string
            description: AdminAppeal is a review an owner asked for, with the key and the owner.
        tenant.v1.AdminAppealSet:
            type: object
            properties:
                appeals:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.AdminAppeal'
        tenant.v1.AdminAuthReply:
            type: object
            properties:
                access_token:
                    type: string
                expires_in:
                    type: integer
                    description: Seconds until the token expires.
                    format: int32
                admin:
                    $ref: '#/components/schemas/tenant.v1.Admin'
        tenant.v1.AdminStats:
            type: object
            properties:
                users:
                    type: string
                banned_users:
                    type: string
                api_keys:
                    type: string
                    description: Keys that are not deleted.
                suspended_api_keys:
                    type: string
                scraping_api_keys:
                    type: string
                    description: Suspended automatically for scraping; included in suspended_api_keys.
        tenant.v1.AdminUser:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
                email:
                    type: string
                tier_id:
                    type: string
                tier_name:
                    type: string
                create_date:
                    type: string
                    format: date-time
                is_banned:
                    type: boolean
                api_key_count:
                    type: integer
                    description: Keys that are not deleted.
                    format: int32
                quota_used:
                    type: string
                    description: Successful verifications today, and the daily quota of the tier.
                daily_quota:
                    type: string
                tier_expires_at:
                    type: string
                    description: When the paid tier ends; empty when it never ends. tier_id already counts an ended tier as free.
                    format: date-time
        tenant.v1.AllowedDomain:
            required:
                - domain
            type: object
            properties:
                domain:
                    type: string
                create_date:
                    readOnly: true
                    type: string
                    format: date-time
            description: |-
                AllowedDomain is one website allowed to use a site key: a lowercase host name, in punycode for
                 international names, such as "shop.example.com"; "*.example.com" for its subdomains (not the
                 domain itself); "localhost" or "localhost:3000" and "127.0.0.1" for development.
        tenant.v1.AllowedOrigin:
            required:
                - ip_address
            type: object
            properties:
                ip_address:
                    type: string
                    description: |-
                        IPv4 or IPv6 address, with an optional prefix length: "203.0.113.4", "203.0.113.0/24",
                         "2001:db8::/32". "0.0.0.0" stands for every address, of either family.
                description:
                    type: string
                    description: What this address is, e.g. the name of the site or office it belongs to.
                create_date:
                    readOnly: true
                    type: string
                    format: date-time
            description: AllowedOrigin is one address, or network, allowed to use a site key.
        tenant.v1.ApiKey:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                    description: Label chosen by the user, 1-64 characters.
                site_key:
                    type: string
                    description: Public key used by the site frontend.
                secret_key:
                    type: string
                    description: Private key used by the site backend on /siteverify.
                is_active:
                    type: boolean
                create_date:
                    type: string
                    format: date-time
                is_suspended:
                    type: boolean
                    description: |-
                        Blocked by an administrator or automatically; the key stops working whatever
                         is_active says, and only an administrator can lift it.
                suspend_reason:
                    type: string
                    description: '"ADMIN" or "SCRAPING" while suspended, empty otherwise.'
                allowed_origins:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.AllowedOrigin'
                    description: |-
                        Addresses allowed to use the site key. Empty means every address may, which is also
                         what an account gets to start with. Only GetApiKey and SetAllowedOrigins fill this in.
                previous_secret_key:
                    type: string
                    description: |-
                        The secret key the last reset replaced; it keeps working until it expires. Empty when
                         there is none, i.e. it expired or was revoked.
                previous_secret_key_expires_at:
                    type: string
                    format: date-time
                allowed_domains:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.AllowedDomain'
                    description: |-
                        Websites allowed to use the site key. Empty means any website may, as for keys created before
                         domains existed. Only GetApiKey, CreateApiKey and SetAllowedDomains fill this in.
                require_behavior:
                    type: boolean
                    description: |-
                        Answers without behaviour data (SDKs before 1.2.0, hand-written integrations) are refused
                         with BEHAVIOR_REQUIRED. New keys start with it on; keys created before it existed keep it off
                         until their owner turns it on.
                scraping_flagged:
                    type: boolean
                    description: 'The scraping check flagged the key today: it is throttled to a lower rate until the day ends.'
                scraping_flagged_at:
                    type: string
                    description: When the key was last flagged; empty when it never was.
                    format: date-time
                today:
                    allOf:
                        - $ref: '#/components/schemas/tenant.v1.KeyCounters'
                    description: Counters of the scraping check for today. Only GetApiKey fills this in.
                latest_appeal:
                    allOf:
                        - $ref: '#/components/schemas/tenant.v1.ApiKeyAppeal'
                    description: The latest review asked for the key, if any. Only GetApiKey fills this in.
        tenant.v1.ApiKeyAppeal:
            type: object
            properties:
                id:
                    type: string
                status:
                    type: string
                    description: '"pending", "approved" or "rejected".'
                message:
                    type: string
                admin_note:
                    type: string
                    description: What the administrator answered; empty while pending.
                create_date:
                    type: string
                    format: date-time
                decided_at:
                    type: string
                    description: Empty while pending.
                    format: date-time
            description: ApiKeyAppeal is a review an owner asked for, of a suspended or flagged key.
        tenant.v1.ApiKeyEvent:
            type: object
            properties:
                id:
                    type: string
                actor:
                    type: string
                    description: '"user" (the owner), "admin" or "system".'
                action:
                    type: string
                    description: |-
                        What happened: "created", "renamed", "activated", "paused", "secret_rotated",
                         "previous_secret_revoked", "allowed_ips_changed", "allowed_domains_changed",
                         "require_behavior_changed", "flagged", "suspended", "unsuspended", "appeal_created",
                         "appeal_approved", "appeal_rejected" or "deleted".
                detail:
                    type: object
                    description: 'The details of the change, e.g. {"name": "Shop"}; never a secret key.'
                create_date:
                    type: string
                    format: date-time
            description: ApiKeyEvent is one entry of the activity log of a key.
        tenant.v1.ApiKeyEventSet:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.ApiKeyEvent'
        tenant.v1.ApiKeySet:
            type: object
            properties:
                api_keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.ApiKey'
                max_api_keys:
                    type: integer
                    description: How many keys this user may hold at once.
                    format: int32
        tenant.v1.AuthReply:
            type: object
            properties:
                access_token:
                    type: string
                expires_in:
                    type: integer
                    description: Seconds until the token expires.
                    format: int32
                user:
                    $ref: '#/components/schemas/tenant.v1.User'
        tenant.v1.ChallengeType:
            type: object
            properties:
                id:
                    type: string
                    description: Value accepted by /challenge/new?challenge_type=, e.g. "image_distort".
                code:
                    type: string
        tenant.v1.ChallengeTypeSet:
            type: object
            properties:
                challenge_types:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.ChallengeType'
        tenant.v1.CreateApiKeyRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                allowed_domains:
                    type: array
                    items:
                        type: string
                    description: The websites allowed to use the key from the start, optional; see AllowedDomain.
        tenant.v1.CreateAppealRequest:
            required:
                - id
                - message
            type: object
            properties:
                id:
                    type: string
                message:
                    type: string
                    description: Why the key should work again, 1-2000 characters.
        tenant.v1.DailyUsage:
            type: object
            properties:
                date:
                    type: string
                    description: Local date, "YYYY-MM-DD".
                challenges:
                    type: string
                verifications:
                    type: string
                successes:
                    type: string
        tenant.v1.DecideAppealRequest:
            required:
                - appeal_id
            type: object
            properties:
                appeal_id:
                    type: string
                approve:
                    type: boolean
                note:
                    type: string
                    description: Shown to the owner, at most 2000 characters.
        tenant.v1.KeyCounters:
            type: object
            properties:
                challenges:
                    type: string
                    description: 'Challenges issued: /challenge/new calls.'
                answers:
                    type: string
                    description: 'Answers checked: /challenge/verify calls that reached a challenge.'
                solved:
                    type: string
                    description: Right answers.
                automated:
                    type: string
                    description: Answers the behaviour check judged automated.
            description: KeyCounters is what the scraping check of a key counted on one day.
        tenant.v1.PublicPlan:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                monthly_price:
                    type: string
                    description: VND for one month; 0 for a plan that is not sold (free).
                yearly_price:
                    type: string
                    description: VND for one year; 0 when the plan is not sold by the year.
                daily_quota:
                    type: string
                    description: Successful verifications per day, across all keys of an account.
                challenge_types:
                    type: array
                    items:
                        type: string
                    description: Challenge types the plan includes, active ones only.
            description: PublicPlan is a tier as the pricing page shows it.
        tenant.v1.PublicPlanSet:
            type: object
            properties:
                plans:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.PublicPlan'
        tenant.v1.Quota:
            type: object
            properties:
                used:
                    type: string
                    description: Successful verifications today, all keys of the user together.
                limit:
                    type: string
                    description: Successful verifications the tier allows per day; /challenge/new refuses once used reaches it.
                date:
                    type: string
                    description: Local date being counted, "YYYY-MM-DD".
                resets_at:
                    type: string
                    description: 'When the count starts over: the next local midnight.'
                    format: date-time
        tenant.v1.SetAllowedDomainsRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                allowed_domains:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.AllowedDomain'
                    description: The whole list, at most 50; domains left out are dropped. Empty allows any website.
        tenant.v1.SetAllowedOriginsRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                allowed_origins:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.AllowedOrigin'
                    description: The whole list; addresses left out are dropped. Empty allows every address.
        tenant.v1.SetApiKeySuspendedRequest:
            required:
                - api_key_id
            type: object
            properties:
                api_key_id:
                    type: string
                suspended:
                    type: boolean
        tenant.v1.SetUserBannedRequest:
            required:
                - user_id
            type: object
            properties:
                user_id:
                    type: string
                banned:
                    type: boolean
        tenant.v1.SignInWithGoogleRequest:
            required:
                - id_token
                - nonce
            type: object
            properties:
                id_token:
                    type: string
                    description: The `credential` returned by Google Identity Services.
                nonce:
                    type: string
                    description: The nonce given to Google Identity Services for this sign-in; it must match the token.
        tenant.v1.UpdateApiKeyRequest:
            required:
                - api_key
                - update_mask
            type: object
            properties:
                api_key:
                    $ref: '#/components/schemas/tenant.v1.ApiKey'
                update_mask:
                    type: string
                    format: field-mask
        tenant.v1.Usage:
            type: object
            properties:
                challenges:
                    type: string
                    description: 'Challenges issued: /challenge/new calls.'
                verifications:
                    type: string
                    description: 'Answers checked: /challenge/verify calls.'
                successes:
                    type: string
                    description: 'Right answers: successful /challenge/verify calls, the usage counted against the quota.'
                days:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.DailyUsage'
                    description: One entry per day in the window, oldest first; empty days are zero.
                by_api_key:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.UsageSeries'
                    description: One series per API key that was used in the window, busiest first.
                by_challenge_type:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.UsageSeries'
                    description: One series per challenge type that was used in the window, busiest first.
        tenant.v1.UsageSeries:
            type: object
            properties:
                id:
                    type: string
                    description: An API key id in Usage.by_api_key, a challenge type in Usage.by_challenge_type.
                challenges:
                    type: string
                verifications:
                    type: string
                successes:
                    type: string
                days:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.DailyUsage'
                    description: The same days as Usage.days, oldest first; empty days are zero.
                name:
                    type: string
                    description: Name of the API key, which may be empty; empty for a challenge type.
                deleted:
                    type: boolean
                    description: Whether the API key was deleted since; its usage still counts.
                create_date:
                    type: string
                    description: When the API key was created; unset for a challenge type.
                    format: date-time
        tenant.v1.User:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
                    description: Display name taken from the Google profile; not used to sign in and not unique.
                email:
                    type: string
                tier_id:
                    type: string
                    description: 'The tier now: a paid tier past tier_expires_at is already reported as free.'
                tier_name:
                    type: string
                create_date:
                    type: string
                    format: date-time
                tier_expires_at:
                    type: string
                    description: When the paid tier ends and the account goes back to free; empty when it never ends.
                    format: date-time
        tenant.v1.UserPage:
            type: object
            properties:
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.AdminUser'
                total_size:
                    type: integer
                    description: Accounts matching the query across all pages.
                    format: int32
tags:
    - name: AdminService
      description: |-
        AdminService lets administrators oversee every account.
         Every RPC requires "Authorization: Bearer <access_token>" from
         AuthService.SignInAdminWithGoogle; any other token gets UNAUTHENTICATED.
    - name: ApiKeyService
      description: |-
        ApiKeyService manages the captcha keys of the signed-in user.
         Every RPC requires "Authorization: Bearer <access_token>".
    - name: AuthService
      description: |-
        AuthService signs people in with their Google account: dashboard users, and apart from
         them the administrators of the admins table. The two get different access tokens.
    - name: CatalogService
      description: CatalogService lists what the tier of the signed-in user may use, and the plans on sale.
    - name: UsageService
      description: |-
        UsageService reports how often the keys of the signed-in user were exercised.
         One record is one challenge: its /challenge/new call and, once answered, the outcome of its
         /challenge/verify call. Only right answers count as usage against the quota.
