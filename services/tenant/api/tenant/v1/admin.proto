syntax = "proto3";

package tenant.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "tenant/v1/auth.proto";
import "tenant/v1/usage.proto";

option go_package = "tenant/api/tenant/v1;v1";

// AdminService lets administrators oversee every account.
// Every RPC requires "Authorization: Bearer <access_token>" from
// AuthService.SignInAdminWithGoogle; any other token gets UNAUTHENTICATED.
service AdminService {
  // GetAdmin returns the signed-in administrator.
  rpc GetAdmin(GetAdminRequest) returns (Admin) {
    option (google.api.http) = {get: "/v1/admin/me"};
  }

  // GetStats counts accounts and keys across the system.
  rpc GetStats(GetStatsRequest) returns (AdminStats) {
    option (google.api.http) = {get: "/v1/admin/stats"};
  }

  // ListUsers pages through accounts, newest first.
  rpc ListUsers(ListUsersRequest) returns (UserPage) {
    option (google.api.http) = {get: "/v1/admin/users"};
  }

  rpc GetUser(GetUserRequest) returns (AdminUser) {
    option (google.api.http) = {get: "/v1/admin/users/{user_id}"};
  }

  // SetUserBanned bans or unbans an account. A ban takes effect on the account's next
  // request: its sessions stop working, it cannot sign in and its keys stop working.
  rpc SetUserBanned(SetUserBannedRequest) returns (AdminUser) {
    option (google.api.http) = {
      post: "/v1/admin/users/{user_id}/banned"
      body: "*"
    };
  }

  // ListUserApiKeys returns the keys of an account that are not deleted, newest first.
  rpc ListUserApiKeys(ListUserApiKeysRequest) returns (AdminApiKeySet) {
    option (google.api.http) = {get: "/v1/admin/users/{user_id}/api-keys"};
  }

  // SetApiKeySuspended suspends a key or lifts its suspension. Lifting it also resets
  // today's scraping counters of the key, so it is not suspended again at once.
  rpc SetApiKeySuspended(SetApiKeySuspendedRequest) returns (AdminApiKey) {
    option (google.api.http) = {
      post: "/v1/admin/api-keys/{api_key_id}/suspended"
      body: "*"
    };
  }

  // ListAppeals returns the reviews owners asked for, newest first: the pending ones unless
  // status says otherwise.
  rpc ListAppeals(ListAppealsRequest) returns (AdminAppealSet) {
    option (google.api.http) = {get: "/v1/admin/appeals"};
  }

  // DecideAppeal approves a pending appeal, which lifts the suspension of the key and clears its
  // flag, or rejects it, with a note the owner sees.
  rpc DecideAppeal(DecideAppealRequest) returns (AdminAppeal) {
    option (google.api.http) = {
      post: "/v1/admin/appeals/{appeal_id}/decision"
      body: "*"
    };
  }

  // GetUsage reports challenges, answers and right answers of the whole system, of one account,
  // or of one key.
  // by_api_key is only filled in for one account or one key.
  rpc GetUsage(AdminUsageRequest) returns (Usage) {
    option (google.api.http) = {get: "/v1/admin/usage"};
  }
}

message GetAdminRequest {}

message GetStatsRequest {}

message AdminStats {
  int64 users = 1;
  int64 banned_users = 2;
  // Keys that are not deleted.
  int64 api_keys = 3;
  int64 suspended_api_keys = 4;
  // Suspended automatically for scraping; included in suspended_api_keys.
  int64 scraping_api_keys = 5;
}

message ListUsersRequest {
  // Matches email or display name, case-insensitively; empty lists everyone.
  string query = 1;
  // 1-based; 0 means 1.
  int32 page = 2;
  // 1-100; 0 means 20.
  int32 page_size = 3;
}

message UserPage {
  repeated AdminUser users = 1;
  // Accounts matching the query across all pages.
  int32 total_size = 2;
}

message AdminUser {
  // Administrators are no longer users; see Admin.
  reserved 8;
  reserved "is_admin";

  string id = 1;
  string username = 2;
  string email = 3;
  string tier_id = 4;
  string tier_name = 5;
  google.protobuf.Timestamp create_date = 6;
  bool is_banned = 7;
  // Keys that are not deleted.
  int32 api_key_count = 9;
  // Successful verifications today, and the daily quota of the tier.
  int64 quota_used = 10;
  int64 daily_quota = 11;
  // When the paid tier ends; empty when it never ends. tier_id already counts an ended tier as free.
  google.protobuf.Timestamp tier_expires_at = 12;
}

message GetUserRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message SetUserBannedRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
  bool banned = 2;
}

message ListUserApiKeysRequest {
  string user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message AdminApiKeySet {
  repeated AdminApiKey api_keys = 1;
}

// AdminApiKey is an API key as administrators see it: never with its secret key.
message AdminApiKey {
  string id = 1;
  string name = 2;
  string site_key = 3;
  bool is_active = 4;
  bool is_suspended = 5;
  // "ADMIN" or "SCRAPING" while suspended, empty otherwise.
  string suspend_reason = 6;
  google.protobuf.Timestamp create_date = 7;
  // Today's scraping counters: challenges issued and answers checked.
  int64 challenges_today = 8;
  int64 verifications_today = 9;
  // The scraping check flagged the key today and throttles it.
  bool scraping_flagged = 10;
  // Right answers today, and answers judged automated.
  int64 solved_today = 11;
  int64 automated_today = 12;
}

message ListAppealsRequest {
  // "pending" (the default when empty), "approved", "rejected" or "all".
  string status = 1;
}

message AdminAppealSet {
  repeated AdminAppeal appeals = 1;
}

// AdminAppeal is a review an owner asked for, with the key and the owner.
message AdminAppeal {
  string id = 1;
  // "pending", "approved" or "rejected".
  string status = 2;
  string message = 3;
  string admin_note = 4;
  google.protobuf.Timestamp create_date = 5;
  google.protobuf.Timestamp decided_at = 6;
  AdminApiKey api_key = 7;
  string user_id = 8;
  string user_email = 9;
  string user_name = 10;
}

message DecideAppealRequest {
  string appeal_id = 1 [(google.api.field_behavior) = REQUIRED];
  bool approve = 2;
  // Shown to the owner, at most 2000 characters.
  string note = 3;
}

message SetApiKeySuspendedRequest {
  string api_key_id = 1 [(google.api.field_behavior) = REQUIRED];
  bool suspended = 2;
}

message AdminUsageRequest {
  // Empty means every account.
  string user_id = 1;
  // Empty means every key in scope.
  string api_key_id = 2;
  // 1-90 days back; 0 means 30. Ignored when all_time is set.
  int32 days = 3;
  // Every day from the first recorded challenge to today.
  bool all_time = 4;
}
