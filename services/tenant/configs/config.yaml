server:
  http:
    addr: ${KRATOS_HTTP_ADDR}
    timeout: 2s
data:
  database:
    source: ${KRATOS_DATABASE_SOURCE}
  redis:
    addrs: ${KRATOS_REDIS_ADDRS}
    password: ${KRATOS_REDIS_PASSWORD}
    read_timeout: 0.2s
    write_timeout: 0.2s
auth:
  secret: ${KRATOS_AUTH_SECRET}
  ttl: 86400s
google:
  # OAuth client ID of the dashboard; ID tokens must be issued for it.
  client_id: ${KRATOS_GOOGLE_CLIENT_ID}
  jwks_url: ${KRATOS_GOOGLE_JWKS_URL}
  issuers: [accounts.google.com, https://accounts.google.com]
api_key:
  max_per_user: 10
usage:
  time_zone: Asia/Ho_Chi_Minh
