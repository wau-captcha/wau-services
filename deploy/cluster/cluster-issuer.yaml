# Let's Encrypt production, HTTP-01 challenges answered through Traefik. The Ingress in
# deploy/k3s asks for it with the annotation cert-manager.io/cluster-issuer: letsencrypt.
#   kubectl apply -f deploy/cluster/cluster-issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Replace with a real address of yours: Let's Encrypt registers the account under it.
    email: daophuckhang091@gmail.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
