# wau-billing: plans and SePay payments (internal /v1/billing/*; public: the SePay IPN only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  labels:
    app: billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      imagePullSecrets:
        - name: ecr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing
          image: wau/billing
          ports:
            - name: http
              containerPort: 8003
          # Secrets and shared settings (database, Redis, keys); see wau.env.example.
          envFrom:
            - secretRef:
                name: wau-env
          env:
            - name: KRATOS_HTTP_ADDR
              value: 0.0.0.0:8003
            # SePay sends the payer back here; the dashboard's billing page reads the result.
            - name: KRATOS_BILLING_RETURN_URL
              value: https://waucaptcha.com/billing
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          lifecycle:
            # Gives Traefik time to drop the pod from its endpoints before SIGTERM arrives. The
            # image has no shell or sleep binary, hence the kubelet's own sleep action.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: billing
  labels:
    app: billing
spec:
  selector:
    app: billing
  ports:
    - name: http
      port: 8003
      targetPort: http
