# Sign-in limit, per visitor address (the real one, thanks to externalTrafficPolicy: Local on
# Traefik's Service): 20 requests a minute, bursts of 20. Signing in is a Server Action, a POST to
# the sign-in page; the HTTPS route below outranks the Ingress's for those requests only. Over
# plain HTTP there is no such route: the Ingress answers them with its redirect to https, so a
# sign-in is never served, nor counted, over HTTP.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login-ratelimit
spec:
  rateLimit:
    average: 20
    period: 1m
    burst: 20
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboard-login
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`waucaptcha.com`) && Method(`POST`) && (Path(`/login`) || Path(`/admin/login`))
      priority: 1000
      # This route stands in for the Ingress's on these requests, so it adds the same headers.
      middlewares:
        - name: security-headers
        - name: login-ratelimit
      services:
        - name: dashboard
          port: 3000
  tls:
    secretName: dashboard-tls
