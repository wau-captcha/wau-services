# goose up against RDS, as user wau_app. Argo CD runs it as a PreSync hook on every sync, so a
# failed migration stops the sync before any app changes. With nothing new to apply it is a no-op.
# The demo seed never runs here. Logs: kubectl -n wau logs job/migrate
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    # The Job stays, logs included, until the next sync deletes it to create its own.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # goose rolls a failed migration back, so a retry starts clean; Argo CD's sync retry does that.
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's user "nobody" is a name, which the kubelet cannot check against runAsNonRoot.
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: wau/migrate
          args: ["up"]
          env:
            - name: GOOSE_DBSTRING
              value: host=wau-captcha.ctyiqygq6ujb.ap-southeast-1.rds.amazonaws.com dbname=wau_captcha sslmode=require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: wau-env
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: wau-env
                  key: PGPASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
