# Argo CD (deploy/argocd/wau.yaml) syncs this from main; nobody applies it by hand any more.
# migrate.yaml is its PreSync hook. The namespace, the Secret wau-env and the pull secret
# ecr-pull are created by hand and stay out of Git and out of Argo CD.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wau
resources:
  - challenge.yaml
  - verify.yaml
  - tenant.yaml
  - billing.yaml
  - dashboard.yaml
  - edge-middlewares.yaml
  - ingress.yaml
  - login-ratelimit.yaml
  - migrate.yaml
# One place for the registry and the release tag of every image. The release workflows set
# newTag (sha-<commit>): wau-services for its services and migrate, wau-dashboard for dashboard.
images:
  - name: wau/challenge
    newName: 430030410164.dkr.ecr.ap-southeast-1.amazonaws.com/wau/challenge
    newTag: sha-f1a886f
  - name: wau/verify
    newName: 430030410164.dkr.ecr.ap-southeast-1.amazonaws.com/wau/verify
    newTag: sha-f1a886f
  - name: wau/tenant
    newName: 430030410164.dkr.ecr.ap-southeast-1.amazonaws.com/wau/tenant
    newTag: sha-f1a886f
  - name: wau/billing
    newName: 430030410164.dkr.ecr.ap-southeast-1.amazonaws.com/wau/billing
    newTag: sha-f1a886f
  - name: wau/migrate
    newName: 430030410164.dkr.ecr.ap-southeast-1.amazonaws.com/wau/migrate
    newTag: sha-f1a886f
  - name: wau/dashboard
    newName: 430030410164.dkr.ecr.ap-southeast-1.amazonaws.com/wau/dashboard
    newTag: sha-cbea285
