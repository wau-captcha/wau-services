name: wau-infra

x-redis-node-common: &redis-node-common
  image: redis:8.10-alpine
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p $$REDIS_PORT -a ${REDIS_PASSWORD} ping"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  redis-node-01:
    <<: *redis-node-common
    container_name: wau-redis-01
    networks:
      - wau-net
    environment:
      REDIS_PORT: 7001
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
    ports:
      - "7001-7006:7001-7006"
      - "17001-17006:17001-17006"
    volumes:
      - redis-node-01-data:/data

  redis-node-02:
    <<: *redis-node-common
    container_name: wau-redis-02
    network_mode: service:redis-node-01
    environment:
      REDIS_PORT: 7002
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
    volumes:
      - redis-node-02-data:/data

  redis-node-03:
    <<: *redis-node-common
    container_name: wau-redis-03
    network_mode: service:redis-node-01
    environment:
      REDIS_PORT: 7003
    command: >
      redis-server
      --port 7003
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
    volumes:
      - redis-node-03-data:/data

  redis-node-04:
    <<: *redis-node-common
    container_name: wau-redis-04
    network_mode: service:redis-node-01
    environment:
      REDIS_PORT: 7004
    command: >
      redis-server
      --port 7004
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
    volumes:
      - redis-node-04-data:/data

  redis-node-05:
    <<: *redis-node-common
    container_name: wau-redis-05
    network_mode: service:redis-node-01
    environment:
      REDIS_PORT: 7005
    command: >
      redis-server
      --port 7005
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
    volumes:
      - redis-node-05-data:/data

  redis-node-06:
    <<: *redis-node-common
    container_name: wau-redis-06
    network_mode: service:redis-node-01
    environment:
      REDIS_PORT: 7006
    command: >
      redis-server
      --port 7006
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
    volumes:
      - redis-node-06-data:/data

  redis-cluster-init:
    image: redis:8.10-alpine
    container_name: wau-redis-cluster-init
    restart: "no"
    network_mode: service:redis-node-01
    depends_on:
      redis-node-01:
        condition: service_healthy
      redis-node-02:
        condition: service_healthy
      redis-node-03:
        condition: service_healthy
      redis-node-04:
        condition: service_healthy
      redis-node-05:
        condition: service_healthy
      redis-node-06:
        condition: service_healthy
    entrypoint: >
      sh -c "
      redis-cli -a ${REDIS_PASSWORD} --cluster check 127.0.0.1:7001 ||
      redis-cli -a ${REDIS_PASSWORD} --cluster create
      127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003
      127.0.0.1:7004 127.0.0.1:7005 127.0.0.1:7006
      --cluster-replicas 1
      --cluster-yes
      "

  postgres:
    image: postgres:18-alpine
    container_name: wau-postgres
    networks:
      - wau-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  wau-net:
    driver: bridge

volumes:
  redis-node-01-data:
  redis-node-02-data:
  redis-node-03-data:
  redis-node-04-data:
  redis-node-05-data:
  redis-node-06-data:
  postgres-data: