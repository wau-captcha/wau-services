syntax = "proto3";

package tenant.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/tenant/v1;v1";

// AuthService signs dashboard users in with their Google account.
service AuthService {
  // SignInWithGoogle exchanges a Google ID token for an access token.
  // The first sign-in of a Google account creates its WAU account.
  rpc SignInWithGoogle(SignInWithGoogleRequest) returns (AuthReply) {
    option (google.api.http) = {
      post: "/v1/auth/google"
      body: "*"
    };
  }

  // GetMe returns the signed-in user. Requires "Authorization: Bearer <access_token>".
  rpc GetMe(GetMeRequest) returns (User) {
    option (google.api.http) = {get: "/v1/me"};
  }
}

message SignInWithGoogleRequest {
  // The `credential` returned by Google Identity Services.
  string id_token = 1 [(google.api.field_behavior) = REQUIRED];
  // The nonce given to Google Identity Services for this sign-in; it must match the token.
  string nonce = 2 [(google.api.field_behavior) = REQUIRED];
}

message GetMeRequest {}

message AuthReply {
  string access_token = 1;
  // Seconds until the token expires.
  int32 expires_in = 2;
  User user = 3;
}

message User {
  string id = 1;
  // Display name taken from the Google profile; not used to sign in and not unique.
  string username = 2;
  string email = 3;
  string tier_id = 4;
  string tier_name = 5;
  google.protobuf.Timestamp create_date = 6;
}
