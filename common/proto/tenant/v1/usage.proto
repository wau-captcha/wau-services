syntax = "proto3";

package tenant.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "common/proto/tenant/v1;v1";

// UsageService reports how often the keys of the signed-in user were exercised.
// One record is one challenge: its /challenge/new call and, once answered, the outcome of its
// /challenge/verify call. Only right answers count as usage against the quota.
service UsageService {
  // GetUsage requires "Authorization: Bearer <access_token>".
  rpc GetUsage(GetUsageRequest) returns (Usage) {
    option (google.api.http) = {get: "/v1/usage"};
  }

  // GetQuota reports today's successful verifications against the daily quota of the tier.
  // Requires "Authorization: Bearer <access_token>".
  rpc GetQuota(GetQuotaRequest) returns (Quota) {
    option (google.api.http) = {get: "/v1/quota"};
  }
}

message GetUsageRequest {
  // Empty means every key of the user, deleted ones included.
  string api_key_id = 1;
  // 1-90 days back; 0 means 30. Ignored when all_time is set.
  int32 days = 2;
  // Every day from the first recorded challenge to today.
  bool all_time = 3;
}

message Usage {
  // Challenges issued: /challenge/new calls.
  int64 challenges = 1;
  // Answers checked: /challenge/verify calls.
  int64 verifications = 2;
  // Right answers: successful /challenge/verify calls, the usage counted against the quota.
  int64 successes = 3;
  // One entry per day in the window, oldest first; empty days are zero.
  repeated DailyUsage days = 4;
  // One series per API key that was used in the window, busiest first.
  repeated UsageSeries by_api_key = 5;
  // One series per challenge type that was used in the window, busiest first.
  repeated UsageSeries by_challenge_type = 6;
}

message UsageSeries {
  // An API key id in Usage.by_api_key, a challenge type in Usage.by_challenge_type.
  string id = 1;
  int64 challenges = 2;
  int64 verifications = 3;
  int64 successes = 4;
  // The same days as Usage.days, oldest first; empty days are zero.
  repeated DailyUsage days = 5;
  // Name of the API key, which may be empty; empty for a challenge type.
  string name = 6;
  // Whether the API key was deleted since; its usage still counts.
  bool deleted = 7;
  // When the API key was created; unset for a challenge type.
  google.protobuf.Timestamp create_date = 8;
}

message GetQuotaRequest {}

message Quota {
  // Successful verifications today, all keys of the user together.
  int64 used = 1;
  // Successful verifications the tier allows per day; /challenge/new refuses once used reaches it.
  int64 limit = 2;
  // Local date being counted, "YYYY-MM-DD".
  string date = 3;
  // When the count starts over: the next local midnight.
  google.protobuf.Timestamp resets_at = 4;
}

message DailyUsage {
  // Local date, "YYYY-MM-DD".
  string date = 1;
  int64 challenges = 2;
  int64 verifications = 3;
  int64 successes = 4;
}
