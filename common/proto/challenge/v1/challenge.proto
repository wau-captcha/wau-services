syntax = "proto3";

package challenge.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "common/proto/challenge/v1;v1";

// ChallengeService issues challenges and checks their answers.
service ChallengeService {
  // NewChallenge issues a challenge for a site key.
  rpc NewChallenge(NewChallengeRequest) returns (Challenge) {
    option (google.api.http) = {get: "/challenge/new"};
  }

  // CheckAnswer consumes a challenge and reports whether the answer is correct.
  // Internal: gRPC only.
  rpc CheckAnswer(CheckAnswerRequest) returns (CheckAnswerReply);
}

message NewChallengeRequest {
  // Public site key of the calling site.
  string site_key = 1 [(google.api.field_behavior) = REQUIRED];
}

message Challenge {
  string challenge_id = 1;
  // Challenge type, e.g. "image_distort".
  string challenge_type = 2;
  // PNG image to solve.
  bytes image = 3;
  // Seconds until the challenge expires.
  int32 expires_in = 4;
}

message CheckAnswerRequest {
  string challenge_id = 1 [(google.api.field_behavior) = REQUIRED];
  string answer = 2 [(google.api.field_behavior) = REQUIRED];
}

message CheckAnswerReply {
  bool success = 1;
  // API key the challenge was issued for.
  string api_key_id = 2;
  string challenge_type = 3;
}
