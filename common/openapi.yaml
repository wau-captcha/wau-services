                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.AdminUser'
                total_size:
                    type: integer
                    description: Accounts matching the query across all pages.
                    format: int32
        verify.v1.SiteVerifyReply:
            type: object
            properties:
                success:
                    type: boolean
                challenge_type:
                    type: string
                challenge_ts:
                    type: string
                    description: Time the challenge was solved.
                    format: date-time
        verify.v1.VerifyChallengeReply:
            type: object
            properties:
                success:
                    type: boolean
                token:
                    type: string
                    description: One-time token, set only on success.
                expires_in:
                    type: integer
                    description: Seconds until the token expires.
                    format: int32
        verify.v1.VerifyChallengeRequest:
            required:
                - challenge_id
                - answer
            type: object
            properties:
                challenge_id:
                    type: string
                answer:
                    type: string
                    description: Text read from the challenge image.
tags:
    - name: AdminService
      description: |-
        AdminService lets administrators oversee every account.
         Every RPC requires "Authorization: Bearer <access_token>" from
         AuthService.SignInAdminWithGoogle; any other token gets UNAUTHENTICATED.
    - name: ApiKeyService
      description: "ApiKeyService manages the captcha keys of the signed-in user.\r\n Every RPC requires \"Authorization: Bearer <access_token>\"."
    - name: AuthService
      description: "AuthService signs people in with their Google account: dashboard users, and apart from\r\n them the administrators of the admins table. The two get different access tokens."
    - name: CatalogService
      description: CatalogService lists what the tier of the signed-in user may use.
    - name: ChallengeService
      description: ChallengeService issues challenges and checks their answers.
    - name: UsageService
      description: "UsageService reports how often the keys of the signed-in user were exercised.\r\n One record is one challenge: its /challenge/new call and, once answered, the outcome of its\r\n /challenge/verify call. Only right answers count as usage against the quota."
    - name: VerifyService
      description: VerifyService turns solved challenges into one-time tokens and validates them for site backends.
