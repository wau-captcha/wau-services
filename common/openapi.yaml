tags:
    - name: ApiKeyService
      description: |-
        ApiKeyService manages the captcha keys of the signed-in user.
         Every RPC requires "Authorization: Bearer <access_token>".
    - name: AuthService
      description: AuthService registers dashboard users and signs them in.
    - name: CatalogService
      description: CatalogService lists what the tier of the signed-in user may use.
    - name: ChallengeService
      description: ChallengeService issues challenges and checks their answers.
    - name: UsageService
      description: |-
        UsageService reports how often the keys of the signed-in user were exercised.
         One record is one answer check done by the verify service.
    - name: VerifyService
      description: VerifyService turns solved challenges into one-time tokens and validates them for site backends.
